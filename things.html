---
layout: default
title: Things
---
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="assets/css/things.css" type="text/css">
</head>
<body>
    <div class="stuff-container">
        <div class="page_header">Piping hot <b class="author_name">Content</b></div>
        <ul class="post-category-list">
            {% for category in site.categories %}
                <li class="post-category-li"><span class="post-category-title" name="{{ category | first }}">{{ category | first }}</span>
                    <ul class="post-title-list">
                        {% for post in category.last %}
                        <li class="ind-post-li"><a href="{{ post.url }}"><span class="post-title">{{ post.title }}</span><span class="post-publish-date">   ({{ post.original_publish_date }})</span></a></li>
                        <br>
                        {% endfor %}
                    </ul>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
